name: Tests

on:
  push:
    branches:
      - refactor-julien
      - "feature/**"
  pull_request:
    branches:
      - refactor-julien
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Import and syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package with development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Check package import
        run: |
          python -c "import pydynamicforest; print(pydynamicforest)"

      - name: Compile package and support modules
        run: |
          python -m compileall pydynamicforest simulations scripts

  tests:
    name: Fast test suite
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package with development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: |
          python -m pytest tests